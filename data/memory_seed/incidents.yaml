- ref: INC-001
  kind: incident
  title: "Hospital pharmacy short-shipped after phosphate binder supplier slip"
  date: "2024-11-18"
  cause: supplier_delay
  account_type: hospital_pharmacy
  signals: [fill_rate, eta_slip_count, delivery_delay_days]
  body: >
    A contract manufacturer pushed back two consecutive dispatches of a phosphate binder SKU.
    The hospital pharmacy at Fictiva General received partial deliveries for several weeks.
    The issue surfaced through repeated ETA revisions rather than through the account itself.
    We learned to watch ETA slips as an early warning before fill rate visibly drops.
  resolution: "Split remaining stock across hospital accounts pro rata, escalate supplier, share revised ETA with pharmacy"
  steps:
    - {n: 1, action: "Split available stock pro rata across affected hospital accounts", owner_role: operations_manager}
    - {n: 2, action: "Escalate to supplier and obtain a committed dispatch date", owner_role: operations_manager}
    - {n: 3, action: "Share the revised ETA with the pharmacy purchase lead", owner_role: account_manager}
  outcome: partial
  outcome_score: 0.55
  provenance: synthetic
  authored_by: "DRAFT - TEAM TO REVIEW"

