- ref: INC-017
  kind: incident
  title: "Stockist orders fell after CKD-MBD binder supplier slip"
  date: "2025-11-14"
  cause: supplier_delay
  account_type: stockist
  signals: [order_volume_delta, fill_rate, complaint_count_delta, response_time_delta, interaction_frequency_delta, stock_cover_days, eta_slip_count]
  body: >
    A supplier delay on a CKD-MBD phosphate binder SKU left the Meridian Distributors stockist short for several weeks.
    Fill rate dropped, the stockist's orders fell for about a month, and delivery complaints piled up while support responses slowed.
    The pattern was noticed when repeated ETA slips coincided with falling warehouse stock cover and fewer rep interactions.
    Operations reallocated inventory from lower-priority accounts and escalated the supplier, and the account manager called the stockist to agree interim supply.
    The stockist stayed with us; the lesson was that early, proactive contact during a supplier slip protects the relationship.
  resolution: "Reallocate inventory from lower-priority accounts, escalate supplier, contact customer"
  steps:
    - {n: 1, action: "Reallocate stock of the delayed SKU from lower-priority accounts to the affected stockist", owner_role: operations_manager}
    - {n: 2, action: "Escalate to the supplier and obtain a revised, committed ETA", owner_role: operations_manager}
    - {n: 3, action: "Call the stockist, share the revised ETA and agree interim supply quantities", owner_role: account_manager}
    - {n: 4, action: "Follow up on the stockist's open delivery complaints until closed", owner_role: support_manager}
  outcome: customer_retained
  outcome_score: 0.9
  provenance: synthetic
  authored_by: "DRAFT - TEAM TO REVIEW"

