# =====================================================================
# STRATA | contracts/scenarios.yaml | v0.1
# Ground-truth scenarios planted by the synthetic data generator.
# The generator writes eval_labels from this file. The engine NEVER reads it.
# Rule: no number in the UI may be "painted"; hero numbers must be COMPUTED
# by the engine from the generated rows. If the computed numbers differ from
# deck slides 7/8/12, change the deck, not the code.
# =====================================================================
sim:
  seed_dev: 20261009          # tuning seed (seed A)
  seed_holdout: 20261010      # evaluation-only seed (seed B). Never tune on it.
  sim_now: "2026-10-09T09:00:00+05:30"
  history_weeks: 104            # two years, so seasonality (S11) has a prior year to learn from
  accounts: 240
  regions: ["Delhi NCR", "Haryana", "Punjab", "UP West", "Rajasthan East", "Uttarakhand"]
  products_catalog_mode: "generic"   # DEFAULT generic (e.g. "Phosphate binder 800 mg, SKU-CKD-01"). 'catalog' (opt-in) may use up to 8 names from the client's public list for background SKUs ONLY — never in S01, S04, S05, S07 (no fake shortages/quality events/payment stress attached to a real brand).
  selector_rank: "rank=N inside a selector = N-th account by baseline 12-week order value, descending, 1-indexed, ties broken by account id"
  noise: "log-normal order noise, weekly seasonality, festival-season index, random account-level drift"

hero_numbers_target:               # what slide 7 shows; the engine must COMPUTE these within tolerance
  account_id: 4821
  orders_delta: -0.31
  complaints_delta: 0.47           # COUNT delta (complaint_count_delta)
  response_time_delta: 0.22
  interaction_delta: -0.40
  risk_score_min: 85
  tolerance_abs: 0.08              # on the four deltas. The hero is a DESIGNED scenario: effect sizes are generator parameters; the engine's job is to recover them from noisy data. Counts are Poisson-noisy, so a tighter tolerance would need seed-cherry-picking, which is forbidden. Report the actual computed values in DECK_DELTAS.
  memory_match: {ref: "INC-017", similarity_display_target: 0.89, tolerance_abs: 0.05}
  note: "Seeding is designed so these emerge; they are not hard-coded anywhere in engine, API or UI."

scenarios:
  - id: S01
    title: "Hero: customer deterioration caused by supplier delay"
    kind: risk
    truth_cause: supplier_delay
    accounts: [4821]
    onset_days_before_now: 35
    ramp: "linear over the first 7 days, then PLATEAU for the last 28 days (so the 4-week window average equals the plateau effect)"
    injected:
      - {table: orders,               effect: "qty_ordered -31%, fill rate 94% -> 62% for one chronic CKD-MBD-type SKU (generic name)"}
      - {table: support/complaints,   effect: "delivery+service complaint COUNT +47%"}
      - {table: support_interactions, effect: "median first response +22%"}
      - {table: account_interactions, effect: "touchpoints -40% (rep tied up elsewhere)"}
      - {table: warehouse_stock,      effect: "stock_cover_days for the SKU falls below 3 for 18 days; eta_slips = 2"}
    expected:
      detected: true
      severity: critical
      min_sources: 4                    # orders + support + crm + inventory (SKU stock-cover/ETA-slip signals attach via the account's purchase of that SKU)
      cause: supplier_delay
      memory_ref: INC-017
      blast_radius_accounts: 6          # other accounts buying the same SKU with mild fill-rate loss
      regulatory_sensitive: false

  - id: S02
    title: "Refill-cadence drift at a chronic-therapy stockist"
    kind: risk
    truth_cause: channel_stockout
    accounts: ["selector: type=stockist, region=Haryana, rank=3"]
    onset_days_before_now: 35
    injected:
      - {table: orders, effect: "median reorder interval of 2 chronic SKUs 14d -> 24d; volume only -9% (weak alone)"}
      - {table: channel_stock, effect: "stock-outs reported at 3 downstream pharmacies"}
    expected: {detected: true, severity: elevated, min_sources: 2, cause: channel_stockout, note: "two sources can never exceed elevated"}

  - id: S03
    title: "Near-expiry exposure from over-allocation"
    kind: risk
    truth_cause: inventory_mismatch
    accounts: ["selector: type=chemist_chain, tier=B, rank=1"]
    onset_days_before_now: 28
    injected:
      - {table: channel_stock, effect: "2,400 units of one batch expire in 75 days; trailing sell-through supports ~700"}
    expected: {detected: true, severity: elevated, cause: inventory_mismatch, action_family: "redistribute to high-velocity account"}

  - id: S04
    title: "Batch quality complaint cluster (regulatory-sensitive)"
    kind: risk
    truth_cause: batch_quality
    accounts: ["selector: 3 accounts in different regions"]
    onset_days_before_now: 9
    injected:
      - {table: complaints, effect: "7 quality complaints on ONE batch_id within 9 days from 3 accounts (e.g. 'seal damaged', 'tablet discolouration')"}
    expected:
      detected: true
      regulatory_sensitive: true
      routed_to: qa_head
      four_eyes: true
      auto_action_allowed: false
