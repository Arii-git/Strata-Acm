# Demo companies and demo users for STRATA login (night build, auth-backend lane).
#
# Everything here is FICTIONAL test data. No real companies, people or mailboxes.
# - Company join codes are FIXED once assigned. Never change or regenerate them; the engine keeps whatever code a
#   company already has in the state DB. Alphabet: A-Z and 2-9 without the look-alikes 0/O/1/I.
# - Demo users live on a non-routable domain, so the mailer never sends real mail to them (outbox only).
# - demo_password is a shared TEST value so judges can sign in per role. It is shown by GET /auth/demo-accounts
#   only while env STRATA_DEMO_LOGINS != "0" (default on). Turn it off for anything public-facing.

demo_password: "Strata-Demo-2026"
demo_domain: "demo.strata.local"

companies:
  - id: co_renalis
    name: "Renalis Pharma Distribution (fictional)"
    industry: "Pharma & healthcare distribution"
    code: "RNL7K2"
    profile: pharma          # data/profiles.py
    dataset: seed_dev        # data/store/<dataset>, generated by npm run seed
  - id: co_brightcart
    name: "BrightCart Consumer Goods (fictional)"
    industry: "FMCG"
    code: "FMC8Q4"
    profile: fmcg
    dataset: seed_brightcart
    seed: 20261107
  - id: co_meridian
    name: "Meridian Freight & Logistics (fictional)"
    industry: "Logistics"
    code: "LGX5T9"
    profile: logistics
    dataset: seed_meridian
    seed: 20261211

